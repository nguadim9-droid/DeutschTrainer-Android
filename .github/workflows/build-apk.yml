name: Build DeutschTrainer Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Assemble & Build App in Canonical Flutter Workspace
        run: |
          # 1. Create fresh canonical Flutter app
          flutter create -t app --org com.deutschtrainer --project-name deutschtrainer_android /tmp/app
          cd /tmp/app

          # 2. Add dependencies
          flutter pub add provider flutter_tts path_provider sqflite path archive
          flutter pub add flutter_localizations --sdk=flutter

          # 3. Copy our Dart source code and unit tests
          cp -rf "$GITHUB_WORKSPACE/lib/"* /tmp/app/lib/
          mkdir -p /tmp/app/test/domain
          cp -rf "$GITHUB_WORKSPACE/test/domain/"* /tmp/app/test/domain/
          rm -f /tmp/app/test/widget_test.dart

          # 4. Insert tools namespace, overrideLibrary for flutter_tts, and TTS queries into AndroidManifest.xml
          sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' /tmp/app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-sdk tools:overrideLibrary="com.eyedeadevelopment.fluttertts" />' /tmp/app/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>' /tmp/app/android/app/src/main/AndroidManifest.xml

          # 5. Set minSdk to 24 in build.gradle / build.gradle.kts
          find /tmp/app/android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' {} +
          find /tmp/app/android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' {} +

          # 6. Upgrade Kotlin to 2.1.0 and suppress metadata version errors for flutter_tts
          sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.1.0"/' /tmp/app/android/settings.gradle.kts || true
          echo "kotlin.suppressUnsupportedVersionErrors=true" >> /tmp/app/android/gradle.properties

          # 7. Run unit tests
          flutter test

          # 8. Build Debug APK
          flutter build apk --debug

          # 9. Copy output APK to repository workspace for artifact upload
          mkdir -p "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          cp -f /tmp/app/build/app/outputs/flutter-apk/*.apk "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeutschTrainer-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
