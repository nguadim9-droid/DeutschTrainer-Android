name: Build DeutschTrainer Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Scaffolding
        run: |
          flutter create -t app --org com.deutschtrainer --platforms=android /tmp/clean_app
          cp -r /tmp/clean_app/android ./android
          cp /tmp/clean_app/.metadata ./.metadata
          rm -rf /tmp/clean_app
          rm -f test/widget_test.dart
          sed -i '/<application/i \    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>' android/app/src/main/AndroidManifest.xml
          python3 -c "import glob; [open(f,'w').write(open(f).read().replace('flutter.minSdkVersion','24')) for f in glob.glob('android/app/build.gradle*')]"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeutschTrainer-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
